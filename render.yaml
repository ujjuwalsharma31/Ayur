services:
  # -------------------------------------------------------------
  # AyurSaathi Backend API (Node.js Web Service)
  # -------------------------------------------------------------
  - type: web
    name: ayursaathi-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # -------------------------------------------------------------
  # AyurSaathi Frontend (Vite + React Static Site)
  # -------------------------------------------------------------
  - type: web
    name: ayursaathi-frontend
    runtime: static
    plan: free
    rootDir: Client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_BASE_URL
        value: https://ayur-txyn.onrender.com
